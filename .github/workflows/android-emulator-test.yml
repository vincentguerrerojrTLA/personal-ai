name: Kylow Android Emulator Test

on:
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-emulator-test.yml"
  workflow_dispatch:

jobs:
  emulator-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Run Kylow on clean Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            mkdir -p artifacts
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb shell am force-stop com.kylow.mobile
            adb shell monkey -p com.kylow.mobile -c android.intent.category.LAUNCHER 1
            sleep 5
            adb shell dumpsys window | grep -q com.kylow.mobile
            adb shell uiautomator dump /sdcard/kylow-ui.xml
            adb pull /sdcard/kylow-ui.xml artifacts/kylow-ui.xml
            adb exec-out screencap -p > artifacts/kylow-home.png
            adb logcat -d > artifacts/logcat.txt
            if grep -E "FATAL EXCEPTION|ANR in com.kylow.mobile" artifacts/logcat.txt; then exit 1; fi
      - name: Upload emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kylow-emulator-evidence
          path: artifacts/
          if-no-files-found: warn
