name: Kylow Android Emulator Test

on:
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-emulator-test.yml"
  workflow_dispatch:

jobs:
  emulator-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug
      - name: Run Kylow on clean Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none -no-snapshot
          disable-linux-hw-accel: true
          script: |
            mkdir -p artifacts
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb shell am force-stop com.kylow.mobile
            adb shell monkey -p com.kylow.mobile -c android.intent.category.LAUNCHER 1
            sleep 5
            adb shell dumpsys window | grep -q com.kylow.mobile
            adb logcat -d > artifacts/logcat.txt
            # Dismiss unrelated host-system ANR dialogs so visual evidence actually captures Kylow.
            adb shell am broadcast -a android.intent.action.CLOSE_SYSTEM_DIALOGS || true
            adb shell input keyevent KEYCODE_ESCAPE || true
            sleep 1
            adb exec-out screencap -p > artifacts/kylow-home.png
            adb shell uiautomator dump /data/local/tmp/kylow-ui.xml || true
            adb pull /data/local/tmp/kylow-ui.xml artifacts/kylow-ui.xml || true
            if grep -E "Process: com.kylow.mobile|ANR in com.kylow.mobile" artifacts/logcat.txt; then exit 1; fi
      - name: Upload emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kylow-emulator-evidence
          path: |
            artifacts/
            android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
