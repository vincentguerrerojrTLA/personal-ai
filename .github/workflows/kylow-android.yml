name: Kylow Android
on:
  push:
    branches: [ main ]
    paths: [ 'android/**', '.github/workflows/kylow-android.yml' ]
  pull_request:
    paths: [ 'android/**', '.github/workflows/kylow-android.yml' ]
jobs:
  test-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unit tests
        run: gradle testDebugUnitTest
      - name: Restore Kylow signing key
        if: github.event_name != 'pull_request'
        env:
          KYLOW_KEYSTORE_BASE64: ${{ secrets.KYLOW_KEYSTORE_BASE64 }}
        run: echo "$KYLOW_KEYSTORE_BASE64" | base64 --decode > kylow-release.jks
      - name: Verify restored signing key copy
        if: github.event_name != 'pull_request'
        run: |
          echo "keystore_bytes=$(wc -c < kylow-release.jks)"
          echo "keystore_sha256=$(sha256sum kylow-release.jks | cut -d\' \' -f1)"
      - name: Build permanently signed release
        if: github.event_name != 'pull_request'
        env:
          KYLOW_KEYSTORE_PATH: ../kylow-release.jks
          KYLOW_KEYSTORE_PASSWORD: ${{ secrets.KYLOW_KEYSTORE_PASSWORD }}
          KYLOW_KEY_ALIAS: ${{ secrets.KYLOW_KEY_ALIAS }}
          KYLOW_KEY_PASSWORD: ${{ secrets.KYLOW_KEYSTORE_PASSWORD }}
        run: gradle assembleRelease
      - name: Remove signing key
        if: always()
        run: rm -f kylow-release.jks
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: Kylow-signed-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
