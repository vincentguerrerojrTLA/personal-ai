name: Publish Kylow Phone Test APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-phone-apk.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build phone-test APK
        working-directory: android
        run: gradle assembleDebug
      - name: Prepare stable APK filename
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Kylow-Phone-Test.apk
      - name: Publish persistent GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete phone-test --cleanup-tag -y || true
          gh release create phone-test Kylow-Phone-Test.apk --title "Kylow Phone Test" --notes "Automated Kylow Android phone-test build. Debug-signed test release; not a production release." --prerelease
