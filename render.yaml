services:
  - type: web
    name: kylow-core
    runtime: python
    plan: free
    rootDir: kylow-core

    buildCommand: pip install -r requirements.txt

    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT

    healthCheckPath: /health

    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10

      - key: KYLOW_ENVIRONMENT
        value: production

      - key: KYLOW_PROVIDER
        value: auto

      - key: KYLOW_API_VERSION
        value: v1

      - key: KYLOW_GROQ_MODEL
        value: openai/gpt-oss-120b

      - key: KYLOW_DATABASE_URL
        sync: false

      - key: KYLOW_GROQ_API_KEY
        sync: false

      - key: KYLOW_API_TOKEN
        sync: false
